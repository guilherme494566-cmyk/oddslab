<style>

.ico { display: inline-block; width: 18px; text-align: center; }

label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 5px; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }

.seg button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc2); background: rgb(245 190 60 / .1); }
.go { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(180deg, var(--acc2), var(--acc)); color: #15110a; font-weight: 800; font-size: 16px; }
.go:disabled { opacity: .6; }
.btn2 { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bd); background: var(--s2); font-weight: 700; font-size: 13.5px; }
.code { font: 800 20px var(--mono); letter-spacing: .04em; color: var(--acc2); word-break: break-all; margin: 6px 0 10px; }

.note ol { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.login { max-width: 380px; margin: 12vh auto 0; }
.login h1 { display: flex; gap: 10px; align-items: center; font-size: 22px; } .login h1 img { width: 40px; height: 40px; border-radius: 11px; }
.drawer { position: fixed; inset: 0; z-index: 20; display: grid; justify-items: end; }
.drawer[hidden] { display: none; }
.drawer .bk { position: absolute; inset: 0; background: rgb(0 0 0 / .6); }
.drawer .pn { position: relative; width: min(560px, 100%); height: 100%; overflow-y: auto; background: #0e1013; border-left: 1px solid var(--bd); padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.dl div { padding: 10px 12px; border-radius: 12px; background: var(--s1); border: 1px solid var(--bd); min-width: 0; } .dl dt { font-size: 11.5px; color: var(--faint); } .dl dd { margin: 2px 0 0; font-weight: 700; overflow-wrap: anywhere; }
.empty { padding: 26px; text-align: center; color: var(--faint); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; color: var(--faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--bd); white-space: nowrap; }
table.t td { padding: 9px 8px; border-bottom: 1px solid var(--bd); vertical-align: top; }
.scroll { overflow-x: auto; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s), esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let PW = ''; try { PW = sessionStorage.getItem('olAdm') || ''; } catch {}
let TAB = 'resumo', CACHE = {}, UF = 'todos', UQ = '', VT = false;
const eur = (v) => (Number(v) || 0).toFixed(2).replace('.', ',') + ' €';
const ago = (ms) => { ms = Number(ms); if (!ms) return '–'; const s = (Date.now() - ms) / 1000; if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h'; return Math.floor(s / 86400) + ' d'; };
const dt = (ms) => ms ? new Date(Number(ms)).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
const dd = (ms) => ms ? new Date(Number(ms)).toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '–';
const PLAT = { ios: '📱 iPhone', android: '🤖 Android', pc: '💻 Computador' };
const PG = { inicio: 'Início', jogos: 'Futebol', tenis: 'Ténis', res: 'Resultados', mk: 'Top 10', mult: 'Múltiplas', dados: 'Dados', tools: 'Agenda', pop: 'Populares', valor: 'Comparar odds', ajuda: 'Como apostar' };
function evTxt(e) {

    case 'jogo': return ['⚽', `Viu o jogo ${d.jogo || d.id}`, ''];
    case 'bloqueado': return ['🔒', `Tentou ver ${d.jogo || d.id}`, 'bloqueado · ' + (d.plano || '')];
    case 'planos': return ['💳', `Viu os planos (${d.plano || ''})`, d.motivo || ''];
    case 'comprar': return ['🛒', `Carregou em comprar ${String(d.plano || '').toUpperCase()}`, d.faturacao || ''];
    case 'teste': return ['🎁', 'Ativou os 7 dias grátis', ''];

    case 'codigo_erro': return ['⚠️', 'Escreveu um código errado', d.erro || ''];
    case 'copiar': return ['📋', `Copiou ${d.aposta || ''}`, d.jogo || ''];
    case 'tutorial': return ['📲', 'Abriu o tutorial de instalação', d.aparelho || ''];
    case 'instalado': return ['⭐', 'Instalou a app', ''];
    case 'cancelar': return ['🚫', `Cancelou a subscrição ${String(d.plano || '').toUpperCase()}`, d.ate ? 'acesso até ' + d.ate + ' · não renovar' : 'não renovar'];
    case 'entrada': return ['✨', d.escolha === 'instalar' ? 'Escolheu instalar no ecrã de entrada' : 'Entrou sem instalar', ''];

async function api(acao, opt = {}) {
  const r = await fetch('/api/admin?acao=' + acao + (opt.q || ''), { method: opt.body ? 'POST' : 'GET', headers: { 'x-admin': PW, 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store' });

}
function login() {
  $('#app').innerHTML = `<div class="login card"><h1><img src="/apple-touch-icon.png" alt="">Painel do dono</h1><p style="color:var(--muted);margin-top:-6px">Escreve a palavra-passe de administrador (ODDSLAB_ADMIN).</p>
    <input class="f" id="pw" type="password" autocomplete="current-password" placeholder="Palavra-passe"><button class="go" id="in">Entrar</button><p class="err" id="er"></p></div>`;
  const go = async () => { PW = $('#pw').value; if (!PW) return; $('#in').disabled = true; try { await fetch('/api/admin?acao=resumo', { headers: { 'x-admin': PW } }).then(async (r) => { if (r.status === 401) throw new Error('Palavra-passe errada.'); }); try { sessionStorage.setItem('olAdm', PW); } catch {} render(); } catch (e) { $('#er').textContent = e.message; PW = ''; } finally { $('#in') && ($('#in').disabled = false); } };
  $('#in').onclick = go; $('#pw').onkeydown = (e) => e.key === 'Enter' && go(); $('#pw').focus();
}
function shell() {
  $('#app').innerHTML = `<header class="top"><div class="bar"><img src="/apple-touch-icon.png" alt=""><b>ODDS<span>LAB</span></b><span class="tag">DONO</span><span class="sp"></span><a href="/">Abrir app</a><button class="lk" id="out">Sair</button></div>
    <nav class="tabs" role="tablist">${[['resumo', 'Resumo'], ['users', 'Utilizadores'], ['vendas', 'Vendas'], ['feed', 'Atividade'], ['criar', 'Criar código']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${TAB === k}">${l}</button>`).join('')}</nav></header>
    <main id="main"><div class="empty">A carregar…</div></main>
    <div class="drawer" id="dr" hidden><div class="bk" data-x></div><div class="pn" id="drp"></div></div>`;
  $('#out').onclick = () => { PW = ''; try { sessionStorage.removeItem('olAdm'); } catch {} render(); };
}
function render() { if (!PW) return login(); if (!$('#main')) shell(); document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === TAB)); ({ resumo, users, vendas, feed, criar })[TAB](); }
function setupNote(e) { return `<div class="note"><b>${esc(e.message)}</b>${e.j && e.j.semBase ? `<ol><li>Na Vercel, abre o projeto oddslab → <b>Storage</b> → <b>Create Database</b> → <b>Upstash for Redis</b> (plano grátis).</li><li>Liga-a ao projeto oddslab (Connect).</li><li>Em Deployments, faz <b>Redeploy</b>.</li></ol><p style="margin:8px 0 0;color:var(--muted)">Os códigos continuam a funcionar sem isto; só os registos e o painel precisam da base de dados.</p>` : ''}</div>`; }
async function resumo() {
  const M = $('#main');
  try {
    const r = CACHE.resumo = await api('resumo'), S = r.serie, sum = (k) => S.reduce((t, d) => t + (d[k] || 0), 0), mx = Math.max(1, ...S.map((d) => d.ativos || 0)), H = S[S.length - 1] || {};
    const F = [['Abriram a app', sum('abrir')], ['Viram os planos', sum('planos')], ['Carregaram em comprar', sum('comprar')], ['Ativaram 7 dias grátis', sum('teste')], ['Ativaram um código', sum('codigo')]], fm = Math.max(1, F[0][1]);

      <div class="kpi a"><span>Receita registada</span><b class="m">${eur(r.vendas.receita)}</b><small>${r.vendas.n} vendas</small></div>
      <div class="kpi g"><span>Assinaturas ativas</span><b class="m">${r.vendas.ativas}</b><small>${Object.entries(r.vendas.porPlano).map(([k, v]) => k.toUpperCase() + ' ' + v).join(' · ') || 'sem vendas'}</small></div>

      <div class="kpi"><span>Utilizadores</span><b class="m">${r.total}</b><small>${H.novos || 0} novos hoje</small></div>

      <div class="kpi"><span>Instalaram a app</span><b class="m">${sum('instalado')}</b><small>14 dias</small></div>
      <div class="kpi"><span>Apostas copiadas</span><b class="m">${sum('copiar')}</b><small>14 dias · hoje ${H.copiar || 0}</small></div>
      <div class="kpi"><span>Bloqueios vistos</span><b class="m">${sum('bloqueado')}</b><small>jogos pagos tocados</small></div></div>

    <h2>Jogos mais vistos hoje</h2><div class="card list">${r.jogosTop.map((j) => `<div class="row"><span class="n">${esc(j.id)}</span><span class="r m">${j.n}×</span></div>`).join('') || '<div class="empty">Ainda nada hoje.</div>'}</div></div></div>`;

    draw();

}
async function openUser(id) {
  const D = $('#dr'), P = $('#drp'); D.hidden = false; P.innerHTML = '<div class="empty">A carregar…</div>';
  try {
    const u = await api('utilizador', { q: '&id=' + encodeURIComponent(id) }), c = u.codigoInfo;
    const E = u.eventos || [], cnt = (k) => E.filter((e) => e.k === k).length;
    let last = '', tl = '';
    E.forEach((e) => { const k = new Date(e.t).toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'short' }); if (k !== last) { last = k; tl += `<div class="dayh">${k}</div>`; } const [ic, t, s] = evTxt(e); tl += `<div class="ev"><time>${new Date(e.t).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })}</time><span><span class="ico">${ic}</span> ${esc(t)}${s ? ` <small>· ${esc(s)}</small>` : ''}</span></div>`; });
    P.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">${esc(u.nome || 'Anónimo ' + id.slice(2, 8))}</h2><button class="btn2" data-x>Fechar</button></div>
      <div style="display:flex;gap:8px;margin-top:10px"><input class="f" id="nm" placeholder="Dar um nome a este utilizador" value="${esc(u.nome || '')}" style="margin:0"><button class="btn2" id="nmS">Guardar</button></div>
      <dl class="dl"><div><dt>Plano</dt><dd>${u.dono === '1' ? '👑 Dono' : u.planoPago ? `${u.planoPago.toUpperCase()} ${Number(u.expira) > Date.now() ? 'até ' + dd(u.expira) : '(expirado)'}` : u.plano === 'pro' ? 'PRO (teste)' : 'Grátis'}</dd></div><div><dt>Aparelho</dt><dd>${PLAT[u.plat] || '–'}${u.std === '1' ? ' · app instalada' : ''}</dd></div>
        <div><dt>Primeira visita</dt><dd>${dt(u.first)}</dd></div><div><dt>Última visita</dt><dd>${dt(u.last)} (${ago(u.last)})</dd></div>
        <div><dt>Local aproximado</dt><dd>${esc([u.cidade, u.pais].filter(Boolean).join(', ') || '–')}</dd></div><div><dt>Ações registadas</dt><dd class="m">${u.n || 0}</dd></div>
        <div><dt>Jogos vistos</dt><dd class="m">${cnt('jogo')} <small style="color:var(--faint)">+ ${cnt('bloqueado')} bloqueados</small></dd></div><div><dt>Apostas copiadas</dt><dd class="m">${cnt('copiar')}</dd></div>
        ${c ? `<div style="grid-column:1/-1"><dt>Compra</dt><dd>${esc(u.codigo)} · ${String(c.plano || '').toUpperCase()} · ${eur(c.valor)} · ${esc(c.nome || '')} ${esc(c.contacto || '')} · criado ${dd(c.criado)}</dd></div>` : ''}</dl>
      <h2>O que fez <small>${E.length} ações mais recentes</small></h2><div class="card feed">${tl || '<div class="empty">Sem ações registadas.</div>'}</div>`;
    $('#nmS').onclick = async () => { await api('nome', { body: { id, nome: $('#nm').value } }); $('#nmS').textContent = 'Guardado ✓'; CACHE.users = null; };
  } catch (e) { if (e.message !== '401') P.innerHTML = setupNote(e) + '<button class="btn2" data-x>Fechar</button>'; }
}
async function vendas() {
  const M = $('#main');
  try {
    const C = (await api('codigos')).codigos, now = Date.now();
    const V = C.filter((c) => VT || (c.tipo !== 'teste'));
    const pg = C.filter((c) => c.tipo === 'venda');
    M.innerHTML = `<div class="kpis"><div class="kpi a"><span>Receita</span><b class="m">${eur(pg.reduce((t, c) => t + (Number(c.valor) || 0), 0))}</b><small>${pg.length} vendas</small></div><div class="kpi g"><span>Ativas</span><b class="m">${pg.filter((c) => Number(c.expira) > now).length}</b><small>por expirar</small></div><div class="kpi"><span>Expiram em 7 dias</span><b class="m">${pg.filter((c) => Number(c.expira) > now && Number(c.expira) - now < 7 * 864e5).length}</b><small>lembra-te de renovar</small></div><div class="kpi"><span>Testes grátis</span><b class="m">${C.filter((c) => c.tipo === 'teste').length}</b><small>${C.filter((c) => c.tipo === 'teste' && (c.aparelhos || []).length).length} usados</small></div></div>
    <h2>Códigos <small><label style="display:inline;font-size:12px"><input type="checkbox" id="vt" ${VT ? 'checked' : ''}> mostrar testes grátis</label></small></h2>
    <div class="card scroll">${V.length ? `<table class="t"><thead><tr><th>Cliente</th><th>Plano</th><th>Valor</th><th>Criado</th><th>Expira</th><th>Aparelhos</th><th>Código</th></tr></thead><tbody>${V.map((c) => { const exp = Number(c.expira) <= now; const k = c.tipo === 'teste' ? 'teste' : c.plano; return `<tr><td><b>${esc(c.nome || (c.tipo === 'teste' ? 'Teste grátis' : '—'))}</b>${c.cancelado ? ' <span class="bd exp">cancelou</span>' : ''}<br><small style="color:var(--faint)">${esc(c.contacto || '')}</small></td><td><span class="bd ${exp ? 'exp' : k}">${exp ? 'expirado' : k}</span></td><td class="m">${eur(c.valor)}</td><td>${dd(c.criado)}</td><td>${c.plano === 'tm' ? 'fim do dia' : dd(c.expira)}</td><td>${(c.aparelhos || []).map((a) => `<a href="#" data-u="${a}" style="color:var(--acc2)">${a.slice(2, 8)}</a>`).join(' ') || '<small style="color:var(--faint)">por ativar</small>'}</td><td class="m" style="font-size:11.5px">${esc(c.codigo)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">Ainda não criaste códigos. Usa o separador "Criar código" depois de receberes um pagamento.</div>'}</div>`;
    $('#vt').onchange = (e) => { VT = e.target.checked; vendas(); };
  } catch (e) { if (e.message !== '401') M.innerHTML = setupNote(e); }
}
let FT = 0;
async function feed() {
  const M = $('#main'); clearTimeout(FT);
  try {
    const E = (await api('atividade')).eventos;
    M.innerHTML = `<h2>Atividade em direto <small>atualiza a cada 20 s</small></h2><div class="card feed">${E.map((e) => { const [ic, t, s] = evTxt(e), q = e.quem || {}; return `<div class="ev"><time>${ago(e.t)}</time><span><span class="who" data-u="${e.u}">${esc(q.nome || 'Anónimo ' + e.u.slice(2, 8))}</span> ${q.plano && q.plano !== 'free' ? `<span class="bd ${q.plano}">${q.plano}</span>` : ''} <span class="ico">${ic}</span> ${esc(t)}${s ? ` <small>· ${esc(s)}</small>` : ''}</span></div>`; }).join('') || '<div class="empty">Ainda sem atividade.</div>'}</div>`;
    FT = setTimeout(() => TAB === 'feed' && feed(), 20000);
  } catch (e) { if (e.message !== '401') M.innerHTML = setupNote(e); }
}
let CP = 'pro', CD = 31;
function criar() {
  const M = $('#main');
  M.innerHTML = `<div class="grid2"><div class="card">
    <label>Plano</label><div class="seg" id="pl">${[['pro', 'PRO'], ['elite', 'ELITE'], ['tm', 'Tip Master'], ['dono', '👑 Dono']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${CP === k}">${l}</button>`).join('')}</div>
    <div id="durB" ${CP === 'tm' || CP === 'dono' ? 'hidden' : ''}><label>Duração</label><div class="seg" id="du">${[[7, '7 dias'], [31, '1 mês'], [92, '3 meses'], [366, '1 ano']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${CD === k}">${l}</button>`).join('')}</div></div>
    <label for="cn">Nome do cliente</label><input class="f" id="cn" placeholder="Ex.: João Silva">
    <label for="cc">Contacto (Instagram, telefone ou email)</label><input class="f" id="cc" placeholder="@joao.silva">
    <label for="cv">Valor recebido (€)</label><input class="f" id="cv" inputmode="decimal" placeholder="4,99">
    <button class="go" id="go">Criar código</button><p class="err" id="err"></p></div>
    <div class="card" id="res" hidden><small id="what" style="color:var(--faint)"></small><div class="code" id="code"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn2" id="cp">Copiar código</button><button class="btn2" id="cpm">Copiar mensagem</button></div><textarea class="f" id="msg" readonly style="min-height:150px;margin-top:10px"></textarea></div></div>`;
  const PRICE = { pro: { 7: '', 31: '4,99', 92: '', 366: '39,99' }, elite: { 7: '', 31: '14,99', 92: '', 366: '119,99' }, tm: { 0: '4,99' }, dono: { 0: '0' } };
  const setV = () => { $('#cv').value = (PRICE[CP] || {})[CP === 'tm' || CP === 'dono' ? 0 : CD] || ''; if (CP === 'dono') $('#cn').value = $('#cn').value || 'Dono'; };
  setV();
  M.querySelectorAll('#pl button').forEach((b) => (b.onclick = () => { CP = b.dataset.v; M.querySelectorAll('#pl button').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#durB').hidden = CP === 'tm' || CP === 'dono'; setV(); }));
  M.querySelectorAll('#du button').forEach((b) => (b.onclick = () => { CD = Number(b.dataset.v); M.querySelectorAll('#du button').forEach((x) => x.setAttribute('aria-pressed', x === b)); setV(); }));
  $('#go').onclick = async () => {
    $('#err').textContent = ''; $('#go').disabled = true;
    try {
      const dias = CP === 'dono' ? 3650 : CP === 'tm' ? 0 : CD;
      const r = await fetch('/api/acesso?acao=codigo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha: PW, plano: CP, dias, nome: $('#cn').value, contacto: $('#cc').value, valor: $('#cv').value }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
      const nome = CP === 'tm' ? 'Tip Master de hoje' : CP === 'dono' ? 'Dono (acesso total)' : CP.toUpperCase() + ' · ' + ({ 7: '7 dias', 31: '1 mês', 92: '3 meses', 366: '1 ano' })[CD];
      $('#res').hidden = false; $('#what').textContent = nome + ($('#cn').value ? ' · ' + $('#cn').value : ''); $('#code').textContent = j.codigo;
      $('#msg').value = CP === 'dono' ? `O teu código de dono: ${j.codigo}\nAbre a app → ? → Planos e preços → "Já tens um código de acesso?" → cola e toca em Ativar. Faz isto em cada aparelho teu.` : `Obrigado${$('#cn').value ? ', ' + $('#cn').value.split(' ')[0] : ''}! O teu acesso ${nome} ao ODDSLAB está pronto.\n\nCódigo: ${j.codigo}\n\n1. Abre ${location.origin}/\n2. No Início, toca em "Ver planos" (ou no botão ? → "Planos e preços")\n3. Em "Já tens um código de acesso?", cola o código e toca em Ativar.\n\n18+ · Joga com responsabilidade.`;
    } catch (e) { $('#err').textContent = e.message; } finally { $('#go').disabled = false; }
  };
  const cp = async (t, b) => { try { await navigator.clipboard.writeText(t); const o = b.textContent; b.textContent = 'Copiado ✓'; setTimeout(() => (b.textContent = o), 1400); } catch { prompt('Copia:', t); } };
  $('#cp').onclick = (e) => cp($('#code').textContent, e.target); $('#cpm').onclick = (e) => cp($('#msg').value, e.target);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; render(); return; }
  const u = e.target.closest('[data-u]'); if (u) { e.preventDefault(); openUser(u.dataset.u); return; }
  if (e.target.closest('[data-x]')) $('#dr').hidden = true;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#dr')) $('#dr').hidden = true; });
render();
</script>
